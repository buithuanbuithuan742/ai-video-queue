
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>AI Video Queue - Quản lý video AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
      line-height: 1.5;
    }

    main { max-width: 760px; margin: auto; }

    h1 { color: #67e8f9; }
    p { color: #cbd5e1; }

    .panel {
      background: #1c293b;
      padding: 16px;
      border-radius: 14px;
      margin: 16px 0;
    }

    input, select, button {
      width: 100%;
      min-height: 44px;
      padding: 11px;
      margin: 6px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input, select {
      color: white;
      background: #111b2b;
      border: 1px solid #40516a;
    }

    button {
      color: white;
      background: #0891b2;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible,
    select:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 2px;
    }

    .video {
      border: 1px solid #40516a;
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .video a { color: #67e8f9; }
    .meta { font-size: 14px; color: #cbd5e1; }
    .delete { background: #b91c1c; }
    .message { min-height: 24px; }
    .thumb {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 420px) {
      body { padding: 10px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🎬 AI Video Queue</h1>
    <p>Quản lý tối đa 20 video AI của bạn.</p>
  </header>

  <section class="panel">
    <h2>➕ Thêm video</h2>

    <form id="videoForm">
      <input id="name" maxlength="150"
        placeholder="Tên video" required>

      <input id="url" type="url"
        placeholder="Đường dẫn video (không bắt buộc)">

      <input id="thumb" type="url"
        placeholder="Đường dẫn ảnh thumbnail (không bắt buộc)">

      <select id="status">
        <option>Ý tưởng</option>
        <option>Đang thực hiện</option>
        <option>Hoàn thành</option>
      </select>

      <button type="submit">Thêm video</button>
    </form>

    <p id="message" class="message" role="status"
      aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>📋 Danh sách video</h2>

    <input id="search" type="search"
      placeholder="Tìm video theo tên...">

    <select id="filter" aria-label="Lọc trạng thái">
      <option value="">Tất cả trạng thái</option>
      <option>Ý tưởng</option>
      <option>Đang thực hiện</option>
      <option>Hoàn thành</option>
    </select>

    <p id="count"></p>
    <div id="list"></div>
  </section>

  <footer>
    <p>Dữ liệu được lưu trên trình duyệt của thiết bị này.</p>
  </footer>
</main>

<script>
(() => {
  "use strict";

  const KEY = "ai-video-queue-v2";
  const MAX = 20;
  const STATUSES = [
    "Ý tưởng", "Đang thực hiện", "Hoàn thành"
  ];

  const $ = id => document.getElementById(id);

  function safeUrl(value) {
    if (typeof value !== "string" || !value.trim()) {
      return "";
    }
    try {
      const u = new URL(value.trim());
      return ["http:", "https:"].includes(u.protocol)
        ? u.href : "";
    } catch {
      return "";
    }
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || "[]");
      if (!Array.isArray(data)) return [];

      return data
        .filter(v => v && typeof v === "object")
        .slice(0, MAX)
        .map((v, i) => ({
          id: String(v.id || i + 1),
          name: String(v.name || "Video chưa đặt tên").slice(0, 150),
          url: safeUrl(v.url),
          thumb: safeUrl(v.thumb),
          status: STATUSES.includes(v.status)
            ? v.status : STATUSES[0]
        }));
    } catch {
      return [];
    }
  }

  let videos = load();

  function persist(next) {
    try {
      localStorage.setItem(KEY, JSON.stringify(next));
      videos = next;
      return true;
    } catch {
      $("message").textContent =
        "Không lưu được dữ liệu. Hãy kiểm tra dung lượng hoặc quyền lưu của trình duyệt.";
      return false;
    }
  }

  function showMessage(text) {
    $("message").textContent = text;
  }

  $("videoForm").addEventListener("submit", event => {
    event.preventDefault();

    if (videos.length >= MAX) {
      showMessage("Danh sách đã đủ 20 video.");
      return;
    }

    const name = $("name").value.trim();
    const rawUrl = $("url").value.trim();
    const rawThumb = $("thumb").value.trim();

    if (!name) {
      showMessage("Vui lòng nhập tên video.");
      return;
    }

    const url = rawUrl ? safeUrl(rawUrl) : "";
    const thumb = rawThumb ? safeUrl(rawThumb) : "";

    if (rawUrl && !url) {
      showMessage("Đường dẫn video phải là URL HTTP hoặc HTTPS hợp lệ.");
      return;
    }

    if (rawThumb && !thumb) {
      showMessage("Đường dẫn ảnh phải là URL HTTP hoặc HTTPS hợp lệ.");
      return;
    }

    const item = {
      id: (Date.now().toString(36) +
        Math.random().toString(36).slice(2, 8)),
      name,
      url,
      thumb,
      status: $("status").value
    };

    if (persist([...videos, item])) {
      $("videoForm").reset();
      showMessage("Đã lưu video thành công.");
      render();
    }
  });

  function changeStatus(id, status) {
    if (!STATUSES.includes(status)) return;

    const next = videos.map(v =>
      v.id === id ? { ...v, status } : v
    );

    if (persist(next)) {
      showMessage("Đã cập nhật trạng thái.");
      render();
    }
  }

  function removeVideo(id) {
    if (!confirm("Bạn có chắc muốn xóa video này?")) return;

    const next = videos.filter(v => v.id !== id);

    if (persist(next)) {
      showMessage("Đã xóa video.");
      render();
    }
  }

  function make(tag, text, className) {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function render() {
    const query = $("search").value.trim().toLowerCase();
    const filter = $("filter").value;

    const items = videos.filter(v =>
      v.name.toLowerCase().includes(query) &&
      (!filter || v.status === filter)
    );

    $("count").textContent =
      `${videos.length}/${MAX} video · Đang hiển thị ${items.length}`;

    const list = $("list");
    list.replaceChildren();

    if (!items.length) {
      list.appendChild(make("p", "Chưa có video phù hợp."));
      return;
    }

    items.forEach(v => {
      const card = make("article", undefined, "video");

      if (v.thumb) {
        const img = make("img", undefined, "thumb");
        img.src = v.thumb;
        img.alt = "Ảnh đại diện: " + v.name;
        img.loading = "lazy";
        img.onerror = () => img.remove();
        card.appendChild(img);
      }

      card.appendChild(make("h3", v.name));
      card.appendChild(make("p", "Trạng thái: " + v.status, "meta"));

      if (v.url) {
        const link = make("a", "Mở video");
        link.href = v.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        card.appendChild(link);
      }

      const select = make("select");
      select.setAttribute("aria-label", "Trạng thái video " + v.name);

      STATUSES.forEach(status => {
        const option = make("option", status);
        option.value = status;
        option.selected = status === v.status;
        select.appendChild(option);
      });

      select.addEventListener("change", () =>
        changeStatus(v.id, select.value)
      );

      card.appendChild(select);

      const del = make("button", "Xóa video", "delete");
      del.type = "button";
      del.addEventListener("click", () => removeVideo(v.id));
      card.appendChild(del);

      list.appendChild(card);
    });
  }

  $("search").addEventListener("input", render);
  $("filter").addEventListener("change", render);

  render();
})();
</script>
</body>
  </html>
